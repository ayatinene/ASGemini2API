services:
  asgemini2api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${ASGEMINI_IMAGE:-asgemini2api:local}
    user: "${ASGEMINI_UID:-1000}:${ASGEMINI_GID:-1000}"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    ports:
      - "127.0.0.1:${ASGEMINI_PORT:-8080}:8080"
    volumes:
      - ./runtime:/inputs:ro
      - ./state:/state
    env_file:
      - path: .env
        required: false
      - path: .env.runtime
        required: false
    environment:
      ASGEMINI_INPUT_DIR: /inputs
      ASGEMINI_STATE_DIR: /state
    command: ["serve", "--host", "0.0.0.0", "--port", "8080"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/asgemini2api", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
